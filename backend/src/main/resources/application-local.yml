spring:
  config:
    import: optional:file:.env[.properties]
  flyway:
    enabled: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: prometheus
  endpoint:
    prometheus:
      access: read-only
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      environment: local
      application: nexo-commerce-backend
