server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: ${SESSION_COOKIE_SAME_SITE:Lax}
management:
  server:
    port: 8081
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: prometheus
  endpoint:
    prometheus:
      access: read-only
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      environment: production
      application: nexo-commerce-backend
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
nexo:
  metrics:
    prometheus-token: ${PROMETHEUS_SCRAPE_TOKEN}
  web:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
