sonar.projectName=NEXO Commerce
sonar.projectVersion=0.1.0
sonar.sources=src,backend/src/main/java
sonar.tests=src/__tests__,backend/src/test/java
sonar.test.inclusions=src/__tests__/**/*.test.ts,backend/src/test/java/**/*.java
sonar.exclusions=src/__tests__/**,**/node_modules/**,**/.next/**,**/target/**,**/build/**,**/dist/**,**/coverage/**
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
