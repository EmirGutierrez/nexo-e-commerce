name: nexo-commerce-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        format: raw
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - nexo-commerce-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        format: raw
      - path: ./backend/.env.team
        required: false
        format: raw
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/nexo_commerce}
      CORS_ALLOWED_ORIGINS: http://localhost:13000
      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_SAME_SITE: Lax
      OPENAPI_ENABLED: "true"
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/catalog/payment-methods || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      SPRING_BACKEND_URL: http://backend:8080
      SPRING_BACKEND_ALLOW_DOCKER_HTTP: "true"
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  nexo-commerce-dev-data:
