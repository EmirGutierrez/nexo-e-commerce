name: nexo-commerce-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        format: raw
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - nexo-commerce-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        format: raw
      - path: ./backend/.env.team
        required: false
        format: raw
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/nexo_commerce}
      CORS_ALLOWED_ORIGINS: http://localhost:13000
      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_SAME_SITE: Lax
      OPENAPI_ENABLED: "true"
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/catalog/payment-methods || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      SPRING_BACKEND_URL: http://backend:8080
      SPRING_BACKEND_ALLOW_DOCKER_HTTP: "true"
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  prometheus:
    profiles:
      - monitoring
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=24h
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - nexo-commerce-dev-prometheus-data:/prometheus

  grafana:
    profiles:
      - monitoring
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-nexo-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:13001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - nexo-commerce-dev-grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

  k6:
    profiles:
      - loadtest
    image: grafana/k6:2.3.0@sha256:2dd4756ec6e14e62778916e1eb850108e4b499304c02df56760fa0bdb0fba0b8
    environment:
      BASE_URL: ${BASE_URL:-http://frontend:3000}
      TEST_ID: ${K6_TEST_ID:-nexo-store}
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(95),p(99),min,max
      K6_PROMETHEUS_RW_LABELS: ${K6_PROMETHEUS_RW_LABELS:-environment=local}
    volumes:
      - ./tests/load:/scripts:ro
    command: ["run", "--out", "experimental-prometheus-rw", "/scripts/store.js"]
    depends_on:
      prometheus:
        condition: service_started
volumes:
  nexo-commerce-dev-data:
  nexo-commerce-dev-prometheus-data:
  nexo-commerce-dev-grafana-data:
