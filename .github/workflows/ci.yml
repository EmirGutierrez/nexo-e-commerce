name: CI

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Compilar frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar vulnerabilidades altas
        run: npm audit --audit-level=high

      - name: Compilar Next.js
        run: npm run build

  backend:
    name: Probar backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener código
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Ejecutar pruebas Maven
        working-directory: backend
        run: mvn -B clean verify

  sonar:
    name: Analizar calidad con SonarQube Cloud
    # El escaneo se activa al crear las variables del proyecto en GitHub.
    if: ${{ vars.SONAR_ORGANIZATION != '' && vars.SONAR_PROJECT_KEY != '' }}
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Compilar clases Java para el análisis
        working-directory: backend
        run: mvn -B -DskipTests package

      - name: Analizar frontend y backend
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

  docker:
    name: Construir imágenes Docker
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
    timeout-minutes: 30
    steps:
      - name: Obtener código
        uses: actions/checkout@v7

      - name: Construir imagen del frontend
        run: docker build --file Dockerfile.frontend --tag nexo-commerce-frontend:ci .

      - name: Construir imagen del backend
        run: docker build --file backend/Dockerfile --tag nexo-commerce-backend:ci backend
