name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:
    inputs:
      operation:
        description: Operación de producción
        required: true
        type: choice
        options:
          - deploy
          - bootstrap-wireguard
        default: deploy

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Compilar frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar vulnerabilidades altas
        run: npm audit --audit-level=high

      - name: Probar frontend y generar cobertura
        run: npm run test:coverage

      - name: Compilar Next.js
        run: npm run build

  backend:
    name: Probar backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurar Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Ejecutar pruebas Maven
        working-directory: backend
        # Cada job parte de un checkout nuevo; no necesita el plugin clean.
        run: mvn -B verify

  sonar:
    name: Analizar calidad con SonarQube Cloud
    # SonarCloud debe tener develop configurada como rama principal del proyecto.
    if: ${{ github.ref == 'refs/heads/develop' || (github.event_name == 'pull_request' && github.base_ref == 'develop') }}
    runs-on: ubuntu-24.04
    needs:
      - frontend
      - backend
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Instalar dependencias frontend
        run: npm ci

      - name: Generar cobertura frontend para SonarQube Cloud
        run: npm run test:coverage

      - name: Probar backend y generar cobertura JaCoCo
        working-directory: backend
        # Checkout nuevo también en este job; verify ejecuta pruebas y genera JaCoCo.
        run: mvn -B verify

      - name: Validar token de SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "$SONAR_TOKEN" || { echo "Falta el secreto SONAR_TOKEN en GitHub Actions"; exit 1; }

      - name: Analizar frontend y backend
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=emirgutierrez
            -Dsonar.projectKey=EmirGutierrez_nexo-e-commerce
            -Dsonar.scanner.skipJreProvisioning=true

  docker:
    name: Construir imágenes Docker
    runs-on: ubuntu-24.04
    needs:
      - frontend
      - backend
    timeout-minutes: 30
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validar Compose de producción
        run: docker compose --env-file deploy/production.env.example --file compose.prod.yaml config --quiet

      - name: Validar Caddyfile de producción
        run: docker run --rm --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" --env SITE_DOMAIN=example.com caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f caddy validate --config /etc/caddy/Caddyfile

      - name: Construir imagen del frontend
        run: docker build --file Dockerfile.frontend --tag nexo-commerce-frontend:ci .

      - name: Construir imagen del backend
        run: docker build --file backend/Dockerfile --tag nexo-commerce-backend:ci backend

      - name: Construir imagen del túnel WireGuard
        run: docker build --file deploy/wireguard/Dockerfile --tag nexo-wireguard:ci deploy/wireguard

      - name: Probar lectura de la configuración WireGuard protegida
        run: |
          set -eu
          config_dir="$(mktemp -d)"
          trap 'rm -rf -- "$config_dir"' EXIT
          chmod 700 "$config_dir"
          printf 'configuración de prueba\n' > "$config_dir/wg0.conf"
          chmod 600 "$config_dir/wg0.conf"
          docker run --rm \
            --read-only \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            --cap-add NET_ADMIN \
            --cap-add DAC_READ_SEARCH \
            --mount "type=bind,src=$config_dir,dst=/etc/wireguard,readonly" \
            --entrypoint /bin/cat \
            nexo-wireguard:ci /etc/wireguard/wg0.conf | grep --fixed-strings --quiet 'configuración de prueba'

      - name: Probar configuración y permisos WireGuard
        run: python3 -m unittest discover --start-directory deploy/tests --pattern 'test_*.py' --verbose

  bootstrap-wireguard:
    name: Preparar acceso SSH privado
    needs:
      - frontend
      - backend
      - sonar
      - docker
    if: >-
      ${{
        always() &&
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/develop' &&
        inputs.operation == 'bootstrap-wireguard' &&
        needs.frontend.result == 'success' &&
        needs.backend.result == 'success' &&
        needs.docker.result == 'success' &&
        needs.sonar.result == 'success'
      }}
    runs-on: ubuntu-24.04
    environment:
      name: production
    concurrency:
      group: nexo-production-deploy
      cancel-in-progress: false
    timeout-minutes: 25
    steps:
      - name: Validar secretos y preparar SSH temporal
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          WIREGUARD_DEPLOY_PRIVATE_KEY: ${{ secrets.WIREGUARD_DEPLOY_PRIVATE_KEY }}
        run: |
          test -n "$VPS_HOST" || { echo "Falta VPS_HOST en production"; exit 1; }
          test -n "$VPS_USER" || { echo "Falta VPS_USER en production"; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "Falta VPS_SSH_KEY en production"; exit 1; }
          test -n "$WIREGUARD_DEPLOY_PRIVATE_KEY" || { echo "Falta WIREGUARD_DEPLOY_PRIVATE_KEY en production"; exit 1; }
          sudo apt-get update
          sudo apt-get install --yes wireguard-tools
          install -m 700 -d "$HOME/.ssh" "$HOME/.config/nexo-wireguard"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/nexo_deploy"
          printf '%s\n' "$WIREGUARD_DEPLOY_PRIVATE_KEY" | tr -d '\r' > "$HOME/.config/nexo-wireguard/privatekey"
          chmod 600 "$HOME/.ssh/nexo_deploy" "$HOME/.config/nexo-wireguard/privatekey"
          ssh-keygen -y -f "$HOME/.ssh/nexo_deploy" > "$HOME/.ssh/nexo_deploy.pub" || {
            echo "VPS_SSH_KEY no contiene una llave privada SSH válida"
            exit 1
          }
          wg pubkey < "$HOME/.config/nexo-wireguard/privatekey" > "$HOME/.config/nexo-wireguard/deploy.pub"
          chmod 600 "$HOME/.config/nexo-wireguard/deploy.pub"
          echo "WIREGUARD_DEPLOY_PUBLIC_KEY=$(cat "$HOME/.config/nexo-wireguard/deploy.pub")" >> "$GITHUB_ENV"
          expected_fingerprint="SHA256:fHpDmhjPDYdpv7Gz7nJtymZtrDFdmiO1WPMmmj8wTO4"
          ssh-keyscan -T 30 -p 22 -t ed25519 "$VPS_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          observed_fingerprints="$(ssh-keygen -lf "$HOME/.ssh/known_hosts" 2>/dev/null | awk '{print $2}' || true)"
          if ! printf '%s\n' "$observed_fingerprints" | grep -Fxq "$expected_fingerprint"; then
            echo "La huella ED25519 de la VPS no coincide con la huella verificada"
            exit 1
          fi

      - name: Actualizar el wrapper restringido por SSH público
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          cat "$HOME/.ssh/nexo_deploy.pub" |
            ssh -i "$HOME/.ssh/nexo_deploy" \
              -p 22 \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$VPS_USER@$VPS_HOST" \
              'cd /opt/nexo-commerce && git pull --ff-only origin develop && ./deploy/nexo-ssh-command.sh bootstrap'

      - name: Sincronizar configuración WireGuard al host
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          printf '%s\n' "$WIREGUARD_DEPLOY_PUBLIC_KEY" |
            ssh -i "$HOME/.ssh/nexo_deploy" \
              -p 22 \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$VPS_USER@$VPS_HOST" sync-wireguard

      - name: Iniciar el servicio WireGuard
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$HOME/.ssh/nexo_deploy" \
            -p 22 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" deploy-app

      - name: Obtener la llave pública WireGuard desde la VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          server_public_key="$(ssh -i "$HOME/.ssh/nexo_deploy" \
            -p 22 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" wireguard-public-key)"
          test -n "$server_public_key" || { echo "La VPS no devolvió la llave pública WireGuard"; exit 1; }
          printf 'WIREGUARD_SERVER_PUBLIC_KEY=%s\n' "$server_public_key" >> "$GITHUB_ENV"

      - name: Conectar el runner a la VPN
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          sudo ip link add dev wg0 type wireguard
          sudo ip address add dev wg0 10.77.0.2/32 peer 10.77.0.1
          sudo wg set wg0 listen-port 48123 private-key "$HOME/.config/nexo-wireguard/privatekey" \
            peer "$WIREGUARD_SERVER_PUBLIC_KEY" allowed-ips 10.77.0.1/32 \
            endpoint "$VPS_HOST:51820" persistent-keepalive 25
          sudo ip link set up dev wg0
          ssh-keyscan -T 30 -p 22 -t ed25519 10.77.0.1 > "$HOME/.ssh/wireguard_known_hosts"
          chmod 600 "$HOME/.ssh/wireguard_known_hosts"
          expected_fingerprint="SHA256:fHpDmhjPDYdpv7Gz7nJtymZtrDFdmiO1WPMmmj8wTO4"
          observed_fingerprints="$(ssh-keygen -lf "$HOME/.ssh/wireguard_known_hosts" 2>/dev/null | awk '{print $2}' || true)"
          if ! printf '%s\n' "$observed_fingerprints" | grep -Fxq "$expected_fingerprint"; then
            echo "La huella SSH por WireGuard no coincide con la huella verificada"
            exit 1
          fi

      - name: Verificar SSH privado y publicar la llave pública del servidor
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$HOME/.ssh/nexo_deploy" \
            -p 22 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o UserKnownHostsFile="$HOME/.ssh/wireguard_known_hosts" \
            "$VPS_USER@10.77.0.1" health
          server_public_key="$WIREGUARD_SERVER_PUBLIC_KEY"
          remote_public_key="$(ssh -i "$HOME/.ssh/nexo_deploy" \
            -p 22 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/wireguard_known_hosts" \
            "$VPS_USER@10.77.0.1" wireguard-public-key)"
          test "$remote_public_key" = "$server_public_key" || {
            echo "La llave pública WireGuard del servidor no coincide"
            exit 1
          }
          {
            echo "## WireGuard activo"
            echo
            echo "Agrega el siguiente valor como variable `WIREGUARD_SERVER_PUBLIC_KEY` del entorno `production` en GitHub:"
            echo
            echo "```text"
            echo "$server_public_key"
            echo "```"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Limpiar llaves temporales del runner
        if: ${{ always() }}
        run: |
          rm -rf -- "$HOME/.config/nexo-wireguard"
          rm -f -- "$HOME/.ssh/nexo_deploy" "$HOME/.ssh/nexo_deploy.pub" \
            "$HOME/.ssh/known_hosts" "$HOME/.ssh/wireguard_known_hosts"

  deploy:
    name: Desplegar producción
    needs:
      - frontend
      - backend
      - sonar
      - docker
    if: >-
      ${{
        always() &&
        github.ref == 'refs/heads/develop' &&
        github.event_name == 'workflow_dispatch' &&
        inputs.operation != 'bootstrap-wireguard' &&
        needs.frontend.result == 'success' &&
        needs.backend.result == 'success' &&
        needs.docker.result == 'success' &&
        needs.sonar.result == 'success'
      }}
    runs-on: ubuntu-24.04
    environment:
      name: production
    concurrency:
      group: nexo-production-deploy
      cancel-in-progress: false
    timeout-minutes: 25
    steps:
      - name: Validar y preparar túnel WireGuard y SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          WIREGUARD_DEPLOY_PRIVATE_KEY: ${{ secrets.WIREGUARD_DEPLOY_PRIVATE_KEY }}
          WIREGUARD_SERVER_PUBLIC_KEY: ${{ vars.WIREGUARD_SERVER_PUBLIC_KEY }}
          MOBILE_JWT_SECRET: ${{ secrets.MOBILE_JWT_SECRET }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          PROMETHEUS_SCRAPE_TOKEN: ${{ secrets.PROMETHEUS_SCRAPE_TOKEN }}
          POSTGRES_EXPORTER_PASSWORD: ${{ secrets.POSTGRES_EXPORTER_PASSWORD }}
        run: |
          test -n "$VPS_HOST" || { echo "Falta el secreto VPS_HOST para el endpoint UDP de WireGuard"; exit 1; }
          test -n "$VPS_USER" || { echo "Falta el secreto VPS_USER"; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "Falta el secreto VPS_SSH_KEY"; exit 1; }
          test -n "$WIREGUARD_DEPLOY_PRIVATE_KEY" || { echo "Falta WIREGUARD_DEPLOY_PRIVATE_KEY en production"; exit 1; }
          test -n "$WIREGUARD_SERVER_PUBLIC_KEY" || { echo "Falta la variable WIREGUARD_SERVER_PUBLIC_KEY en production"; exit 1; }
          test -n "$MOBILE_JWT_SECRET" || { echo "Falta el secreto MOBILE_JWT_SECRET en production"; exit 1; }
          test -n "$GRAFANA_ADMIN_PASSWORD" || { echo "Falta el secreto GRAFANA_ADMIN_PASSWORD en production"; exit 1; }
          test -n "$PROMETHEUS_SCRAPE_TOKEN" || { echo "Falta el secreto PROMETHEUS_SCRAPE_TOKEN en production"; exit 1; }
          test -n "$POSTGRES_EXPORTER_PASSWORD" || { echo "Falta el secreto POSTGRES_EXPORTER_PASSWORD en production"; exit 1; }
          sudo apt-get update
          sudo apt-get install --yes wireguard-tools
          # GITHUB_ENV aplica en pasos posteriores; exporta también para ssh-keyscan en este paso.
          NEXO_SSH_HOST="10.77.0.1"
          NEXO_SSH_PORT="22"
          export NEXO_SSH_HOST NEXO_SSH_PORT
          {
            echo "NEXO_SSH_HOST=$NEXO_SSH_HOST"
            echo "NEXO_SSH_PORT=$NEXO_SSH_PORT"
          } >> "$GITHUB_ENV"
          install -m 700 -d "$HOME/.ssh" "$HOME/.config/nexo-wireguard"
          printf '%s\n' "$WIREGUARD_DEPLOY_PRIVATE_KEY" | tr -d '\r' > "$HOME/.config/nexo-wireguard/privatekey"
          printf '%s\n' "$WIREGUARD_SERVER_PUBLIC_KEY" | tr -d '\r' > "$HOME/.config/nexo-wireguard/server.pub"
          chmod 600 "$HOME/.config/nexo-wireguard/privatekey" "$HOME/.config/nexo-wireguard/server.pub"
          sudo ip link add dev wg0 type wireguard
          sudo ip address add dev wg0 10.77.0.2/32 peer 10.77.0.1
          sudo wg set wg0 listen-port 48123 private-key "$HOME/.config/nexo-wireguard/privatekey" \
            peer "$WIREGUARD_SERVER_PUBLIC_KEY" allowed-ips 10.77.0.1/32 \
            endpoint "$VPS_HOST:51820" persistent-keepalive 25
          sudo ip link set up dev wg0
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/nexo_deploy"
          chmod 600 "$HOME/.ssh/nexo_deploy"
          ssh-keygen -y -f "$HOME/.ssh/nexo_deploy" > "$HOME/.ssh/nexo_deploy.pub" || {
            echo "El secreto VPS_SSH_KEY no contiene una llave privada SSH válida"
            exit 1
          }
          expected_fingerprint="SHA256:fHpDmhjPDYdpv7Gz7nJtymZtrDFdmiO1WPMmmj8wTO4"
          ssh-keyscan -T 30 -p "$NEXO_SSH_PORT" -t ed25519 "$NEXO_SSH_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          observed_fingerprints="$(ssh-keygen -lf "$HOME/.ssh/known_hosts" 2>/dev/null | awk '{print $2}' || true)"
          if ! printf '%s\n' "$observed_fingerprints" | grep -Fxq "$expected_fingerprint"; then
            echo "La huella ED25519 de la VPS no coincide con la huella verificada"
            exit 1
          fi

      - name: Limitar la llave SSH de despliegue
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          cat "$HOME/.ssh/nexo_deploy.pub" |
            ssh -i "$HOME/.ssh/nexo_deploy" \
              -p "$NEXO_SSH_PORT" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$VPS_USER@$NEXO_SSH_HOST" \
              'cd /opt/nexo-commerce && git pull --ff-only origin develop && ./deploy/nexo-ssh-command.sh bootstrap'

      - name: Sincronizar clave MFA con la VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          MFA_ENCRYPTION_KEY: ${{ secrets.MFA_ENCRYPTION_KEY }}
        run: |
          test -n "$MFA_ENCRYPTION_KEY" || { echo "Falta el secreto MFA_ENCRYPTION_KEY en el entorno production"; exit 1; }
          printf '%s\n' "$MFA_ENCRYPTION_KEY" |
            ssh -i "$HOME/.ssh/nexo_deploy" \
              -p "$NEXO_SSH_PORT" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$VPS_USER@$NEXO_SSH_HOST" sync-mfa

      - name: Sincronizar clave JWT móvil con la VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          MOBILE_JWT_SECRET: ${{ secrets.MOBILE_JWT_SECRET }}
        run: |
          printf '%s\n' "$MOBILE_JWT_SECRET" |
            ssh -i "$HOME/.ssh/nexo_deploy" \
              -p "$NEXO_SSH_PORT" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$VPS_USER@$NEXO_SSH_HOST" sync-mobile-jwt

      - name: Sincronizar credenciales de monitoreo con la VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          PROMETHEUS_SCRAPE_TOKEN: ${{ secrets.PROMETHEUS_SCRAPE_TOKEN }}
          POSTGRES_EXPORTER_PASSWORD: ${{ secrets.POSTGRES_EXPORTER_PASSWORD }}
        run: |
          printf '%s\n%s\n%s\n' "$GRAFANA_ADMIN_PASSWORD" "$PROMETHEUS_SCRAPE_TOKEN" "$POSTGRES_EXPORTER_PASSWORD" |
            ssh -i "$HOME/.ssh/nexo_deploy" \
              -p "$NEXO_SSH_PORT" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$VPS_USER@$NEXO_SSH_HOST" sync-monitoring

      - name: Sincronizar token del túnel
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "No hay token de Tunnel configurado; se omite la sincronización."
            exit 0
          fi
          printf '%s\n' "$CLOUDFLARE_TUNNEL_TOKEN" |
            ssh -i "$HOME/.ssh/nexo_deploy" \
              -p "$NEXO_SSH_PORT" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$VPS_USER@$NEXO_SSH_HOST" sync-tunnel

      - name: Confirmar conectividad SSH por WireGuard
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          WIREGUARD_SERVER_PUBLIC_KEY: ${{ vars.WIREGUARD_SERVER_PUBLIC_KEY }}
        run: |
          ssh -i "$HOME/.ssh/nexo_deploy" \
            -p "$NEXO_SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_USER@$NEXO_SSH_HOST" health
          observed_public_key="$(ssh -i "$HOME/.ssh/nexo_deploy" \
            -p "$NEXO_SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_USER@$NEXO_SSH_HOST" wireguard-public-key)"
          test "$observed_public_key" = "$WIREGUARD_SERVER_PUBLIC_KEY" || {
            echo "La llave pública WireGuard del servidor no coincide con la variable production"
            exit 1
          }

      - name: Actualizar aplicación en la VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
        run: >-
          ssh -i "$HOME/.ssh/nexo_deploy"
          -p "$NEXO_SSH_PORT"
          -o IdentitiesOnly=yes
          -o BatchMode=yes
          -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          "$VPS_USER@$NEXO_SSH_HOST"
          deploy-app

      - name: Verificar frontend y API públicos
        run: |
          frontend_headers="$(mktemp)"
          api_headers="$(mktemp)"
          trap 'rm -f "$frontend_headers" "$api_headers"' EXIT
          curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-all-errors --dump-header "$frontend_headers" https://nexo-e-commerce.com/ -o /dev/null
          curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-all-errors --dump-header "$api_headers" https://api.nexo-e-commerce.com/api/catalog/products -o /dev/null
          grep --ignore-case --quiet '^Content-Security-Policy:' "$frontend_headers"
          grep --ignore-case --quiet '^X-Content-Type-Options: *nosniff' "$frontend_headers"
          grep --ignore-case --quiet '^Content-Security-Policy:' "$api_headers"
          grep --ignore-case --quiet '^X-Content-Type-Options: *nosniff' "$api_headers"

      - name: Limpiar llaves temporales del runner
        if: ${{ always() }}
        run: |
          rm -rf -- "$HOME/.config/nexo-wireguard"
          rm -f -- "$HOME/.ssh/nexo_deploy" "$HOME/.ssh/nexo_deploy.pub" "$HOME/.ssh/known_hosts"
