name: nexo-commerce-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    user: postgres
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB in deploy/.env.production}
      POSTGRES_USER: ${DATABASE_USERNAME:?Define DATABASE_USERNAME in deploy/.env.production}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Define DATABASE_PASSWORD in deploy/.env.production}
    volumes:
      - nexo-commerce-prod-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Define POSTGRES_DB in deploy/.env.production}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?Define DATABASE_USERNAME in deploy/.env.production}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Define DATABASE_PASSWORD in deploy/.env.production}
      CORS_ALLOWED_ORIGINS: https://${SITE_DOMAIN:?Define SITE_DOMAIN in deploy/.env.production},https://www.${SITE_DOMAIN}
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAME_SITE: Lax
      OPENAPI_ENABLED: "false"
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      PROMETHEUS_SCRAPE_TOKEN: ${PROMETHEUS_SCRAPE_TOKEN:?Define PROMETHEUS_SCRAPE_TOKEN in deploy/.env.production}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
      - database
      - api
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/catalog/payment-methods || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      SPRING_BACKEND_URL: http://backend:8080
      SPRING_BACKEND_ALLOW_DOCKER_HTTP: "true"
      SESSION_COOKIE_SECURE: "true"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app
      - site
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  caddy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Define SITE_DOMAIN in deploy/.env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - nexo-commerce-caddy-data:/data
      - nexo-commerce-caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
      grafana:
        condition: service_started
    networks:
      - edge
      - site
      - api

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    user: nobody
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    environment:
      PROMETHEUS_SCRAPE_TOKEN: ${PROMETHEUS_SCRAPE_TOKEN:?Define PROMETHEUS_SCRAPE_TOKEN in deploy/.env.production}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --config.expand-env
      - --web.enable-remote-write-receiver
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - nexo-commerce-prod-prometheus-data:/prometheus
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    user: "472"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Define GRAFANA_ADMIN_PASSWORD in deploy/.env.production}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_SECURITY_DISABLE_BRUTE_FORCE_LOGIN_PROTECTION: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://${SITE_DOMAIN:?Define SITE_DOMAIN in deploy/.env.production}/monitoring/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ENFORCE_DOMAIN: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - nexo-commerce-prod-grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - site
      - monitoring

  k6:
    image: grafana/k6:2.3.0
    profiles:
      - loadtest
    restart: "no"
    environment:
      BASE_URL: ${BASE_URL:-http://frontend:3000}
      TEST_ID: ${K6_TEST_ID:-nexo-prod-smoke}
      K6_PROFILE: ${K6_PROFILE:-production}
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(95),p(99),min,max
      K6_PROMETHEUS_RW_LABELS: environment=production
    volumes:
      - ./tests/load:/scripts:ro
    command: ["run", "--out", "experimental-prometheus-rw", "/scripts/store.js"]
    depends_on:
      prometheus:
        condition: service_started
      frontend:
        condition: service_healthy
    networks:
      - site
      - monitoring

  cloudflared:
    image: cloudflare/cloudflared:2026.10.2@sha256:0e56c13c7058fcef9c4f0e7d83372f82330548dbf8f8b366f3d8b506526d93b2
    profiles:
      - cloudflare-tunnel
    command: ["tunnel", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cloudflare-egress

  wireguard:
    build:
      context: ./deploy/wireguard
      dockerfile: Dockerfile
    profiles:
      - wireguard
    restart: unless-stopped
    logging: *default-logging
    network_mode: host
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - DAC_READ_SEARCH
    read_only: true
    tmpfs:
      - /run:rw,noexec,nosuid,nodev,size=8m
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    volumes:
      - ./deploy/.runtime/wireguard/wg0.conf:/etc/wireguard/wg0.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "ip link show wg0 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  nexo-commerce-prod-data:
  nexo-commerce-caddy-data:
  nexo-commerce-caddy-config:
  nexo-commerce-prod-prometheus-data:
  nexo-commerce-prod-grafana-data:

networks:
  edge:
  site:
    internal: true
  app:
    internal: true
  api:
    internal: true
  database:
    internal: true
  monitoring:
    internal: true
  cloudflare-egress:
